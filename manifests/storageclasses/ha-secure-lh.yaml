apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ha-secure-lh
  labels:
    app.kubernetes.io/name: longhorn
    storage.type: secure-encrypted
    security.level: high
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain                      # Retain encrypted data
volumeBindingMode: Immediate
parameters:
  # Security Configuration
  numberOfReplicas: "2"                    # High availability for secure data
  encrypted: "true"                        # Enable volume encryption
  
  # Standard Configuration
  staleReplicaTimeout: "30"
  dataEngine: "v1"
  fsType: "ext4"                           # ext4 supports encryption well
  dataLocality: "disabled"
  disableRevisionCounter: "true"
  backupTargetName: "default"
  unmapMarkSnapChainRemoved: "ignored"
  
  # Anti-Affinity for Security (spread replicas)
  replicaSoftAntiAffinity: "true"          # Spread across different nodes
  replicaDiskSoftAntiAffinity: "true"      # Spread across different disks
  replicaZoneSoftAntiAffinity: "true"      # Spread across zones if available