apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ha-perf-lh
  labels:
    app.kubernetes.io/name: longhorn
    storage.type: high-performance
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  # High Performance Configuration
  numberOfReplicas: "2"
  staleReplicaTimeout: "20"                # Faster timeout for performance
  dataEngine: "v1"
  fsType: "ext4"
  dataLocality: "best-effort"              # Try to keep data local for performance
  disableRevisionCounter: "true"
  backupTargetName: "default"
  unmapMarkSnapChainRemoved: "enabled"
  
  # Performance Optimizations
  # These would be used if you have tagged nodes/disks
  # nodeSelector: "storage=nvme"
  # diskSelector: "type=ssd"