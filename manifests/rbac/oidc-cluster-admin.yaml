# Grants cluster-admin to the itl-cluster-admin group from Keycloak OIDC auth.
# See docs/3-authentication - kube-apiserver authenticates via the JWT/OIDC
# authenticator (KubeAuthenticationConfig in Talos), issuer
# https://sts.itlusions.com/realms/itlusions, groups claim "groups" with no
# prefix. Keycloak emits the full group PATH as the claim value, and
# top-level groups always have a leading "/" (confirmed via
# `kubectl auth whoami`: Groups included "/itl-cluster-admin", not
# "itl-cluster-admin") - the subject name below must match that exactly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: /itl-cluster-admin
    apiGroup: rbac.authorization.k8s.io
